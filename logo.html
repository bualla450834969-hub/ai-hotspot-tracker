<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokrealm · Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a12;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  }
  /* 背景渐变光斑 */
  .bg-orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.4;
    pointer-events: none; z-index: 0;
  }
  .bg-orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(64,156,255,0.3), transparent 70%);
    top: -100px; left: -100px;
    animation: orbFloat1 20s ease-in-out infinite;
  }
  .bg-orb-2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(175,82,222,0.25), transparent 70%);
    bottom: -80px; right: -80px;
    animation: orbFloat2 25s ease-in-out infinite;
  }
  .bg-orb-3 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(255,100,170,0.15), transparent 70%);
    top: 40%; left: 60%;
    animation: orbFloat3 18s ease-in-out infinite;
  }
  @keyframes orbFloat1 {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(80px, 60px); }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(-60px, -80px); }
  }
  @keyframes orbFloat3 {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(-40px, 50px); }
  }

  /* ===== LOGO（和工作台完全一致的实现） ===== */
  .bg-logo {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 55vmin;
    height: 55vmin;
    z-index: 1;
  }
  .bg-logo-svg {
    width: 100%; height: 100%;
    overflow: visible;
  }
  .bg-glass {
    fill: rgba(255,255,255,0.04);
    stroke: rgba(255,255,255,0.12);
    stroke-width: 1.5;
    cursor: pointer;
    transition: stroke 0.3s ease;
  }
  .bg-glass:hover {
    stroke: rgba(255,255,255,0.3);
  }
  .bg-glow {
    opacity: 0.7;
    transform-origin: center;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .bg-glow-main { animation: bgGlowPulse 4s ease-in-out infinite; }
  .bg-glow-sub { animation: bgGlowPulse 4s ease-in-out infinite; }
  @keyframes bgGlowPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }

  /* 品牌文字 */
  .brand {
    position: fixed;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 2;
    pointer-events: none;
  }
  .brand-name {
    font-size: clamp(24px, 4vw, 42px);
    font-weight: 200;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.85);
    margin-bottom: 8px;
  }
  .brand-tag {
    font-size: clamp(11px, 1.5vw, 14px);
    font-weight: 300;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

  /* 移动端 */
  @media (max-width: 768px) {
    .bg-logo { width: 70vmin; height: 70vmin; }
  }
  @media (max-width: 480px) {
    .bg-logo { width: 80vmin; height: 80vmin; }
    .bg-glow { opacity: 0.6; }
  }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<script>
// 混合模式光晕：鼠标不在色块上时自动游走，鼠标在色块上时跟随鼠标
function initBgLogoGlow() {
  var svg = document.querySelector('.bg-logo-svg');
  if (!svg) return;
  var rgMains = [];
  var rgSubs = [];
  var glassPaths = [];
  for (var i = 1; i <= 4; i++) {
    rgMains.push(document.getElementById('bgMain' + i));
    rgSubs.push(document.getElementById('bgSub' + i));
  }
  // 获取所有毛玻璃path（最后4个path）
  var allPaths = svg.querySelectorAll('path.bg-glass');
  allPaths.forEach(function(p) { glassPaths.push(p); });

  // 解析viewBox
  var vb = svg.viewBox.baseVal;
  var vbX = vb.x, vbY = vb.y, vbW = vb.width, vbH = vb.height;

  var t = Math.random() * Math.PI * 2;
  var blocks = [];
  for (var i = 0; i < 4; i++) {
    blocks.push({
      fx: 0.3 + Math.random() * 0.5,
      fy: 0.25 + Math.random() * 0.4,
      fx2: 0.1 + Math.random() * 0.2,
      fy2: 0.15 + Math.random() * 0.25,
      phase: Math.random() * Math.PI * 2,
      breathSpeed: 0.012 + Math.random() * 0.004,
      breathPhase: i * Math.PI / 2, // 错落相位：4色块依次错开90度，形成波浪呼吸
      hueSpeed: 0.4 + Math.random() * 0.3,
      huePhase: Math.random() * 360,
      cx: 50, cy: 50,
      mode: 'auto',
      targetCx: 50, targetCy: 50
    });
  }

  // 边缘闪耀光点初始化（流星拖尾效果）
  var sparks = [];
  var frameCount = 0;
  var activeSparkCount = 0; // 全局并发限制：最多2颗
  var MAX_SPARKS = 2;
  var TRAIL_LENGTH = 1;
  var SVG_NS = 'http://www.w3.org/2000/svg';
  for (var si = 0; si < 4; si++) {
    var trailEls = [];
    for (var ti = 0; ti < TRAIL_LENGTH; ti++) {
      var c = document.createElementNS(SVG_NS, 'circle');
      c.setAttribute('fill', 'url(#sparkGrad)');
      c.setAttribute('filter', 'url(#sparkBlur)');
      c.setAttribute('opacity', '0');
      svg.appendChild(c);
      trailEls.push(c);
    }
    var pathLen = glassPaths[si].getTotalLength();
    sparks.push({
      trailEls: trailEls,
      path: glassPaths[si],
      pathLen: pathLen,
      active: false,
      progress: 0,
      baseSpeed: 0.004,
      nextFrame: 300 + Math.floor(Math.random() * 600), // 初始延迟5~15秒，更稀有
      direction: 1,
      startOffset: 0,
      sparkle: 0 // 随机亮度爆发强度（0~1）
    });
  }

  // 鼠标坐标转SVG百分比
  function mouseToSvgPercent(e) {
    var pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    var ctm = svg.getScreenCTM();
    if (!ctm) return { x: 50, y: 50 };
    var svgPt = pt.matrixTransform(ctm.inverse());
    return {
      x: (svgPt.x - vbX) / vbW * 100,
      y: (svgPt.y - vbY) / vbH * 100
    };
  }

  // 给每个色块绑定鼠标事件
  glassPaths.forEach(function(path, idx) {
    path.addEventListener('mouseenter', function(e) {
      blocks[idx].mode = 'follow';
      var p = mouseToSvgPercent(e);
      blocks[idx].targetCx = p.x;
      blocks[idx].targetCy = p.y;
    });
    path.addEventListener('mousemove', function(e) {
      if (blocks[idx].mode === 'follow') {
        var p = mouseToSvgPercent(e);
        blocks[idx].targetCx = p.x;
        blocks[idx].targetCy = p.y;
      }
    });
    path.addEventListener('mouseleave', function() {
      blocks[idx].mode = 'auto';
    });
  });

  function animate() {
    t += 0.012;
    for (var i = 0; i < 4; i++) {
      var b = blocks[i];
      // 呼吸值：0~1的正弦波，4色块错落相位形成波浪
      var breath = 0.5 + 0.5 * Math.sin(t * b.breathSpeed * 60 + b.breathPhase);
      // 光晕半径呼吸：低谷收缩到40%/25%，高峰扩张到88%/60%
      var mainR = (40 + breath * 48).toFixed(1) + '%';
      var subR = (25 + breath * 35).toFixed(1) + '%';
      // 光晕透明度呼吸：低谷几乎熄灭(0.03)，高峰最亮(0.88)
      var glowOpacity = (0.03 + breath * 0.85).toFixed(2);

      if (b.mode === 'auto') {
        b.targetCx = 50 + Math.sin(t * b.fx + b.phase) * 20 + Math.sin(t * b.fx2 + b.phase * 2) * 8;
        b.targetCy = 50 + Math.cos(t * b.fy + b.phase * 1.5) * 18 + Math.cos(t * b.fy2 + b.phase) * 6;
        b.cx += (b.targetCx - b.cx) * 0.04;
        b.cy += (b.targetCy - b.cy) * 0.04;
      } else {
        b.cx += (b.targetCx - b.cx) * 0.15;
        b.cy += (b.targetCy - b.cy) * 0.15;
      }

      if (rgMains[i]) {
        rgMains[i].setAttribute('cx', b.cx.toFixed(2) + '%');
        rgMains[i].setAttribute('cy', b.cy.toFixed(2) + '%');
        rgMains[i].setAttribute('r', mainR);
      }
      if (rgSubs[i]) {
        rgSubs[i].setAttribute('cx', (b.cx + 5).toFixed(2) + '%');
        rgSubs[i].setAttribute('cy', (b.cy - 3).toFixed(2) + '%');
        rgSubs[i].setAttribute('r', subR);
      }
      // 透明度呼吸（作用在光晕path上）
      var mainPath = svg.querySelector('.bgm-' + (i+1));
      var subPath = svg.querySelector('.bgs-' + (i+1));
      if (mainPath) mainPath.style.opacity = glowOpacity;
      if (subPath) subPath.style.opacity = (parseFloat(glowOpacity) * 0.8).toFixed(2);
      // 独立色相循环：每个色块不同相位+速度
      var hue = (t * b.hueSpeed * 60 + b.huePhase) % 360;
      if (mainPath) mainPath.style.filter = 'hue-rotate(' + hue.toFixed(0) + 'deg) url(#bgBlurM)';
      if (subPath) subPath.style.filter = 'hue-rotate(' + hue.toFixed(0) + 'deg) url(#bgBlurS)';
    }

    // 边缘闪耀光点：流星拖尾，ease-in-out速度，随机起点和方向
    frameCount++;
    for (var si = 0; si < sparks.length; si++) {
      var s = sparks[si];
      if (!s.active && frameCount >= s.nextFrame) {
        if (activeSparkCount < MAX_SPARKS) {
          s.active = true;
          s.progress = 0;
          s.baseSpeed = 0.003 + Math.random() * 0.004;
          s.direction = Math.random() > 0.5 ? 1 : -1;
          s.startOffset = Math.random() * s.pathLen;
          activeSparkCount++;
        } else {
          // 达到上限，推迟100帧再试
          s.nextFrame = frameCount + 200 + Math.floor(Math.random() * 300); // 达到上限推迟3~8秒
        }
      }
      if (s.active) {
        // ease-in-out：两端慢中间快
        var easeFactor = 0.25 + 0.75 * Math.sin(s.progress * Math.PI);
        s.progress += s.baseSpeed * easeFactor;
        if (s.progress >= 1) {
          s.active = false;
          activeSparkCount--;
          s.nextFrame = frameCount + 800 + Math.floor(Math.random() * 1200); // 间隔13~33秒，留神秘感
          for (var ti = 0; ti < TRAIL_LENGTH; ti++) {
            s.trailEls[ti].setAttribute('opacity', '0');
          }
        } else {
          // 整体透明度：前12%渐入，后12%渐出
          var globalOp;
          if (s.progress < 0.12) globalOp = s.progress / 0.12;
          else if (s.progress > 0.88) globalOp = (1 - s.progress) / 0.12;
          else globalOp = 1;
          // 拖尾各点：头部最新最亮最大，尾部渐小渐暗
          for (var ti2 = 0; ti2 < TRAIL_LENGTH; ti2++) {
            var trailProgress = Math.max(0, s.progress - ti2 * s.baseSpeed * 10);
            var len = (s.startOffset + trailProgress * s.pathLen * s.direction) % s.pathLen;
            if (len < 0) len += s.pathLen;
            var pt = s.path.getPointAtLength(len);
            var sizeFactor = 1 - ti2 / TRAIL_LENGTH;
            // 光点大小微妙脉动
            var pulse = 1 + 0.15 * Math.sin(s.progress * Math.PI * 6 + si);
            // 随机亮度爆发：0.8%概率触发，触发后快速衰减
            if (Math.random() < 0.008) s.sparkle = 1;
            s.sparkle *= 0.92;
            var sparkleBoost = 1 + s.sparkle * 0.9;
            var sizeSparkle = 1 + s.sparkle * 0.35;
            s.trailEls[ti2].setAttribute('cx', pt.x.toFixed(1));
            s.trailEls[ti2].setAttribute('cy', pt.y.toFixed(1));
            s.trailEls[ti2].setAttribute('r', (5.5 * sizeFactor * pulse * sizeSparkle + 0.8).toFixed(1));
            // 透明度微妙闪烁 + 随机爆发
            var flicker = 0.85 + 0.15 * Math.sin(s.progress * Math.PI * 11 + si * 2.3);
            s.trailEls[ti2].setAttribute('opacity', (globalOp * sizeFactor * flicker * sparkleBoost).toFixed(2));
          }
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
}
initBgLogoGlow();
</script>
</body>
</html>
