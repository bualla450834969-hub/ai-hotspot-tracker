<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokrealm · Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a12;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  }
  /* 背景渐变光斑 */
  .bg-orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.4;
    pointer-events: none; z-index: 0;
  }
  .bg-orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(64,156,255,0.3), transparent 70%);
    top: -100px; left: -100px;
    animation: orbFloat1 20s ease-in-out infinite;
  }
  .bg-orb-2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(175,82,222,0.25), transparent 70%);
    bottom: -80px; right: -80px;
    animation: orbFloat2 25s ease-in-out infinite;
  }
  .bg-orb-3 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(255,100,170,0.15), transparent 70%);
    top: 40%; left: 60%;
    animation: orbFloat3 18s ease-in-out infinite;
  }
  @keyframes orbFloat1 {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(80px, 60px); }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(-60px, -80px); }
  }
  @keyframes orbFloat3 {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(-40px, 50px); }
  }

  /* ===== LOGO（和工作台完全一致的实现） ===== */
  .bg-logo {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 55vmin;
    height: 55vmin;
    z-index: 1;
    pointer-events: none;
    opacity: 1;
  }
  .bg-logo-svg {
    width: 100%; height: 100%;
    overflow: visible;
  }
  .bg-glass {
    fill: rgba(255,255,255,0.04);
    stroke: rgba(255,255,255,0.12);
    stroke-width: 1.5;
  }
  .bg-glow {
    opacity: 0.7;
    transform-origin: center;
    transition: opacity 0.4s ease;
  }
  .bg-glow-main { animation: bgGlowHue 14s linear infinite, bgGlowPulse 4s ease-in-out infinite; }
  .bg-glow-sub { animation: bgGlowHueSub 14s linear infinite, bgGlowPulse 4s ease-in-out infinite; }
  @keyframes bgGlowHue { 0%{filter:hue-rotate(0deg) url(#bgBlurM);} 100%{filter:hue-rotate(360deg) url(#bgBlurM);} }
  @keyframes bgGlowHueSub { 0%{filter:hue-rotate(0deg) url(#bgBlurS);} 100%{filter:hue-rotate(360deg) url(#bgBlurS);} }
  @keyframes bgGlowPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }

  /* 品牌文字 */
  .brand {
    position: fixed;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 2;
    pointer-events: none;
  }
  .brand-name {
    font-size: clamp(24px, 4vw, 42px);
    font-weight: 200;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.85);
    margin-bottom: 8px;
  }
  .brand-tag {
    font-size: clamp(11px, 1.5vw, 14px);
    font-weight: 300;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

  /* 移动端 */
  @media (max-width: 768px) {
    .bg-logo { width: 70vmin; height: 70vmin; }
  }
  @media (max-width: 480px) {
    .bg-logo { width: 80vmin; height: 80vmin; }
    .bg-glow { opacity: 0.6; }
  }
</style>
</head>

<script>
// 和工作台完全一致的自动随机游走光晕
function initBgLogoGlow() {
  var svg = document.querySelector('.bg-logo-svg');
  if (!svg) return;
  var rgMains = [];
  var rgSubs = [];
  for (var i = 1; i <= 4; i++) {
    rgMains.push(document.getElementById('bgMain' + i));
    rgSubs.push(document.getElementById('bgSub' + i));
  }
  var t = Math.random() * Math.PI * 2;
  var seeds = [];
  for (var i = 0; i < 4; i++) {
    seeds.push({
      fx: 0.3 + Math.random() * 0.5,
      fy: 0.25 + Math.random() * 0.4,
      fx2: 0.1 + Math.random() * 0.2,
      fy2: 0.15 + Math.random() * 0.25,
      phase: Math.random() * Math.PI * 2,
      cx: 50, cy: 50
    });
  }

  function animate() {
    t += 0.012;
    for (var i = 0; i < 4; i++) {
      var s = seeds[i];
      var targetX = 50 + Math.sin(t * s.fx + s.phase) * 20 + Math.sin(t * s.fx2 + s.phase * 2) * 8;
      var targetY = 50 + Math.cos(t * s.fy + s.phase * 1.5) * 18 + Math.cos(t * s.fy2 + s.phase) * 6;
      s.cx += (targetX - s.cx) * 0.04;
      s.cy += (targetY - s.cy) * 0.04;

      if (rgMains[i]) {
        rgMains[i].setAttribute('cx', s.cx.toFixed(2) + '%');
        rgMains[i].setAttribute('cy', s.cy.toFixed(2) + '%');
      }
      if (rgSubs[i]) {
        rgSubs[i].setAttribute('cx', (s.cx + 5).toFixed(2) + '%');
        rgSubs[i].setAttribute('cy', (s.cy - 3).toFixed(2) + '%');
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
}
initBgLogoGlow();
</script>
