<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热点追踪工作台 - 行业选择</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height:100vh;
  background: linear-gradient(135deg, #0a0a0f 0%, #1a1025 50%, #0f1a2a 100%);
  color: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex; align-items: center; justify-content: center;
}
.container { max-width:900px; width:100%; padding:40px 20px; text-align:center; }
h1 { font-size:32px; margin-bottom:8px; background:linear-gradient(135deg,#a78bfa,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { color:#94a3b8; margin-bottom:40px; font-size:14px; }
.industry-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; }
.industry-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding:28px 24px;
  backdrop-filter: blur(20px);
  cursor:pointer; transition: all 0.3s ease;
  text-decoration:none; color:inherit; display:block;
}
.industry-card:hover { transform: translateY(-4px); background:rgba(255,255,255,0.1); border-color:rgba(139,92,246,0.4); }
.industry-icon { font-size:36px; margin-bottom:12px; }
.industry-name { font-size:20px; font-weight:600; margin-bottom:6px; }
.industry-desc { font-size:13px; color:#94a3b8; line-height:1.6; }
.industry-stats { margin-top:12px; font-size:12px; color:#64748b; }
</style>
</head>
<body>
<div class="container">
  <h1>热点追踪工作台</h1>
  <p class="subtitle">选择行业进入工作台</p>
  <div class="industry-grid">
    <a class="industry-card" href="shared/app.html?ind=ai">
      <div class="industry-icon">🤖</div>
      <div class="industry-name">AI热点追踪</div>
      <div class="industry-desc">抖音+小红书双平台AI赛道热词、选题、爆款拆解</div>
      <div class="industry-stats">50个关键词 · 944条作品 · 每日自动采集</div>
    </a>
  </div>
</div>
</body>
</html>
